name: iOS Simulator

# Opens the production build in Mobile Safari inside Apple's iOS Simulator and checks a picture of the
# screen. The WebKit in ci.yml is Playwright's own build on Linux: it is not Safari, and its screenshots
# paint any 3D scene flat. Safari has painted the 3D table wrong three times with every other test green,
# so this job looks at what the iPhone's browser really draws.
#
# The page drives itself (e2e/ios/driver.js), because no test tool can drive that browser from outside.
# This check is not one of the three that branch protection requires.

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/ios/**"
      - "e2e/page-tools.js"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ios-simulator.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safari:
    name: ios-safari
    # Pinned, not macos-latest: the Xcode and simulators on a runner change when the image does.
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node e2e/ios/pick-device.mjs)
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: Open the game in Mobile Safari, let it play to the state to photograph, and take the picture
        run: |
          node e2e/ios/serve.mjs ios-report.json &
          sleep 2
          # Safari is sometimes not ready to take a link right after the simulator boots, so try a few times.
          opened=no
          for attempt in 1 2 3 4 5; do
            if xcrun simctl openurl "$UDID" "http://127.0.0.1:4174/"; then
              opened=yes
              break
            fi
            sleep 10
          done
          if [ "$opened" = no ]; then
            echo "::error::The simulator did not open the link in five tries."
            exit 1
          fi
          for attempt in $(seq 1 100); do
            [ -f ios-report.json ] && break
            sleep 2
          done
          sleep 1
          xcrun simctl io "$UDID" screenshot ios-screenshot.png
          if [ ! -f ios-report.json ]; then
            echo "::error::The page did not report within 200 seconds. The screenshot in the artifact shows what Safari had on screen."
            exit 1
          fi
      - name: Check what Safari painted
        run: node e2e/ios/check-shot.mjs ios-screenshot.png ios-report.json
      - name: Keep the screenshot and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator
          path: |
            ios-screenshot.png
            ios-report.json
          if-no-files-found: ignore
          retention-days: 14
