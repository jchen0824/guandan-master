name: Browser tests

# The browser tests and screenshot comparison, inside Microsoft's Playwright image: the browsers, their system
# libraries and the fonts the screenshots are drawn with come with the image, so nothing is downloaded from an apt
# mirror and the pictures cannot shift when a runner image changes. The job is named `e2e` because branch
# protection on main requires a check of that name. Keep the image tag equal to the @playwright/test version in
# package-lock.json; `npm run check:conventions` fails when they differ, and new pictures must then be accepted.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Browser tests and screenshots (desktop, phone upright, phone landscape, small phone)
        run: npm run test:e2e
      # test-results holds each picture that differs or is missing as *-actual.png: `npm run screenshots:accept -- <run id>` reads them.
      - name: Keep the report, traces and new screenshots when a test fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
