# Dependabot opens pull requests that update dependencies. CI decides whether an update is safe;
# a person still merges it. The prefixes keep its titles valid Conventional Commits (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # One pull request a week for everything that should be safe; major versions come one at a time.
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
